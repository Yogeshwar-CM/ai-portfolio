name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Portfolio checks
        run: node verify.mjs
      - name: Production build smoke test
        run: node build.mjs https://portfolio-ci.invalid
